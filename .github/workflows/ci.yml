name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fix_platform_ci?schema=public
      AUTH_ENCRYPTION_KEY: ci-only-key-not-for-real-use-0123456789
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fix_platform_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit -p tsconfig.json

      - run: npm run api:build

      - run: npx prisma migrate deploy

      - run: npm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: checks
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fix_platform_ci?schema=public
      AUTH_ENCRYPTION_KEY: ci-only-key-not-for-real-use-0123456789
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      PUBLIC_WEB_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      DEV_AUTH_ENABLED: "true"
      NEXT_PUBLIC_DEV_AUTH_ENABLED: "true"
      BOOTSTRAP_LOCAL_TEST_USERS_CONFIRM: I_UNDERSTAND_STAGING_TEST_USERS
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fix_platform_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma migrate deploy

      - run: npx tsx api/src/bootstrap-course.ts
      - run: npx tsx api/src/bootstrap-local-test-users.ts

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
