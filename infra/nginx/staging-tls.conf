events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 443 ssl;
    # One multiplexed connection instead of six HTTP/1.1 queues — the first load fires ~20
    # requests (JS chunks, CSS, fonts, covers, API) that otherwise wait on each other.
    http2 on;
    server_name staging.fix-trading.info;
    client_max_body_size 20m;

    ssl_certificate /certs/fullchain.cer;
    ssl_certificate_key /certs/staging.fix-trading.info.key;

    # Talks straight to api/web, not through the plain-HTTP `proxy` service —
    # avoids a double proxy hop that would clobber X-Forwarded-Proto/TRUST_PROXY_HOPS.
    location /api/ {
      proxy_pass http://api:4000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    location / {
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
